<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">ANTI-REA Terminal Audit: Before ANTI-REA (Unprotected) vs. After ANTI-REA (antirea-rust-v20)</title>
  <desc id="desc">Split-pane tmux terminal comparison showing an unprotected binary leaking plaintext keys and clean C pseudocode to REA and Ghidra on the left, versus an ANTI-REA antirea-rust-v20 hardened binary achieving 0 of 45 recovery across 9 external 5-PC fleet cycles and 100 percent bit-exact execution on the right.</desc>

  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1217"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="titlebar-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2028"/>
      <stop offset="100%" stop-color="#151920"/>
    </linearGradient>
    <clipPath id="frame-clip">
      <rect x="1" y="1" width="1198" height="658" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, Menlo, monospace; }
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

    @keyframes blink-cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: blink-cursor 1.05s step-end infinite; }
    .cursor-delay { animation: blink-cursor 1.05s step-end infinite 0.52s; }
  </style>

  <!-- ==================== UNIFIED TERMINAL FRAME ==================== -->
  <g clip-path="url(#frame-clip)">
    <!-- Terminal Base Background -->
    <rect x="0" y="0" width="1200" height="660" fill="url(#term-bg)"/>

    <!-- Subtle Pane Tints -->
    <rect x="0" y="38" width="600" height="590" fill="#140f12" opacity="0.45"/>
    <rect x="600" y="38" width="600" height="590" fill="#0d1512" opacity="0.45"/>

    <!-- ==================== WINDOW TITLEBAR ==================== -->
    <rect x="0" y="0" width="1200" height="38" fill="url(#titlebar-bg)"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#262c36" stroke-width="1"/>

    <!-- macOS / Ghostty Window Dots -->
    <circle cx="22" cy="19" r="5.5" fill="#e06c75" opacity="0.88"/>
    <circle cx="40" cy="19" r="5.5" fill="#e5c07b" opacity="0.88"/>
    <circle cx="58" cy="19" r="5.5" fill="#98c379" opacity="0.88"/>

    <!-- Window Title -->
    <text x="600" y="23" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#adb5bd">
      tmux — antirea-audit   ( <tspan fill="#f4727c">before: unprotected</tspan>  |  <tspan fill="#4ade80">after: antirea-rust-v20</tspan> )
    </text>

    <!-- Right Kerckhoffs Tag -->
    <rect x="1008" y="9" width="174" height="20" rx="4" fill="#202630" stroke="#303846"/>
    <text x="1095" y="22.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">KERCKHOFFS OPEN-SRC</text>

    <!-- ==================== PANE HEADER BARS ==================== -->
    <!-- Left Pane Header -->
    <rect x="0" y="38" width="600" height="34" fill="#181215"/>
    <rect x="0" y="38" width="600" height="2.5" fill="#e05260"/>
    <line x1="0" y1="72" x2="600" y2="72" stroke="#2d1f24" stroke-width="1"/>

    <text x="20" y="59.5" class="mono" font-size="12" font-weight="800" fill="#fb7185">BEFORE ANTI-REA</text>
    <text x="148" y="59.5" class="mono" font-size="11.5" fill="#8b949e">~/build/app_unprotected.exe</text>
    <rect x="442" y="46" width="140" height="19" rx="4" fill="#311319" stroke="#7f1d2a"/>
    <text x="512" y="59" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#fda4af">UNPROTECTED · EXPOSED</text>

    <!-- Right Pane Header -->
    <rect x="600" y="38" width="600" height="34" fill="#101815"/>
    <rect x="600" y="38" width="600" height="2.5" fill="#22c55e"/>
    <line x1="600" y1="72" x2="1200" y2="72" stroke="#1b3025" stroke-width="1"/>

    <text x="620" y="59.5" class="mono" font-size="12" font-weight="800" fill="#4ade80">AFTER ANTI-REA</text>
    <text x="742" y="59.5" class="mono" font-size="11.5" fill="#8b949e">~/build/app_antirea_v20.exe</text>
    <rect x="1038" y="46" width="144" height="19" rx="4" fill="#0f291c" stroke="#1f633e"/>
    <text x="1110" y="59" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#86efac">DEFENDED · W^X · V20</text>

    <!-- Center Vertical tmux Split Border -->
    <line x1="600" y1="38" x2="600" y2="628" stroke="#2c3340" stroke-width="1.5"/>

    <!-- ==================== LEFT PANE BODY: BEFORE ANTI-REA ==================== -->
    <g transform="translate(20, 96)">
      <!-- Command 1: strings dump -->
      <text x="0" y="0" class="mono" font-size="12">
        <tspan fill="#fb7185" font-weight="700">$</tspan>
        <tspan fill="#e5e7eb"> strings ./app_unprotected.exe | grep -E </tspan>
        <tspan fill="#e5c07b">"KEY|SBOX|AUTH"</tspan>
      </text>
      <text x="0" y="21" class="mono" font-size="11.5" fill="#d19a66">0x14002a10  <tspan fill="#f8fafc">AUTH_TAG</tspan>   = <tspan fill="#fbbf24">"LICENSE_CORE_SECRET_TAG"</tspan></text>
      <text x="0" y="39" class="mono" font-size="11.5" fill="#d19a66">0x14002b00  <tspan fill="#fb7185">SBOX_PLAIN</tspan> = <tspan fill="#cbd5e1">{ 63 7c 77 7b f2 6b 6f c5 ... } (256B)</tspan></text>

      <!-- Command 2: REA + Ghidra decompile -->
      <text x="0" y="70" class="mono" font-size="12">
        <tspan fill="#fb7185" font-weight="700">$</tspan>
        <tspan fill="#e5e7eb"> rea decompile ./app_unprotected.exe --fn </tspan>
        <tspan fill="#e5c07b">verify_core</tspan>
      </text>

      <!-- Decompiler Code Block -->
      <rect x="0" y="82" width="560" height="134" rx="6" fill="#13161c" stroke="#362127" stroke-width="1"/>
      <path d="M 6 82 H 34 V 216 H 6 A 6 6 0 0 1 0 210 V 88 A 6 6 0 0 1 6 82 Z" fill="#18141a"/>
      <line x1="34" y1="82" x2="34" y2="216" stroke="#2a2026" stroke-width="1"/>

      <!-- Line numbers -->
      <text x="17" y="102" text-anchor="middle" class="mono" font-size="10.5" fill="#5c6370">01</text>
      <text x="17" y="121" text-anchor="middle" class="mono" font-size="10.5" fill="#5c6370">02</text>
      <text x="17" y="140" text-anchor="middle" class="mono" font-size="10.5" fill="#5c6370">03</text>
      <text x="17" y="159" text-anchor="middle" class="mono" font-size="10.5" fill="#5c6370">04</text>
      <text x="17" y="178" text-anchor="middle" class="mono" font-size="10.5" fill="#5c6370">05</text>
      <text x="17" y="197" text-anchor="middle" class="mono" font-size="10.5" fill="#5c6370">06</text>

      <!-- Plaintext Decompiled C -->
      <text x="46" y="102" class="mono" font-size="11.5" fill="#c678dd">uint64_t <tspan fill="#f8fafc" font-weight="700">verify_core</tspan><tspan fill="#abb2bf">(uint64_t key) {</tspan></text>
      <text x="60" y="121" class="mono" font-size="11" fill="#6b7280">// Ghidra: clean symbols, exact formula, direct call graph</text>
      <text x="60" y="140" class="mono" font-size="11.5" fill="#abb2bf">uint64_t k = key ^ <tspan fill="#e5c07b" font-weight="700">0x9E3779B97F4A7C15ULL</tspan>;</text>
      <text x="60" y="159" class="mono" font-size="11.5" fill="#abb2bf">uint64_t h = <tspan fill="#fb7185" font-weight="700">SBOX_PLAIN</tspan>[k &amp; 0xFF];</text>
      <text x="60" y="178" class="mono" font-size="11.5" fill="#c678dd">return <tspan fill="#abb2bf">rotl64(h, 17) == </tspan><tspan fill="#e5c07b" font-weight="700">AUTH_TAG</tspan><tspan fill="#abb2bf">;</tspan><tspan fill="#e06c75"> // 1-byte jmp patch</tspan></text>
      <text x="46" y="197" class="mono" font-size="11.5" fill="#abb2bf">}</text>

      <!-- Command 3: REA autonomous clone -->
      <text x="0" y="246" class="mono" font-size="12">
        <tspan fill="#fb7185" font-weight="700">$</tspan>
        <tspan fill="#e5e7eb"> rea agent --task </tspan>
        <tspan fill="#e5c07b">"analyze &amp; clone verify_core"</tspan>
      </text>
      <text x="0" y="268" class="mono" font-size="11.5" fill="#9ca3af"><tspan fill="#fb7185">[step 1]</tspan> static_decompile  -&gt; full C logic &amp; call graph extracted</text>
      <text x="0" y="287" class="mono" font-size="11.5" fill="#9ca3af"><tspan fill="#fb7185">[step 2]</tspan> dump_rdata        -&gt; plaintext secret keys &amp; 256B S-Box</text>
      <text x="0" y="306" class="mono" font-size="11.5" fill="#9ca3af"><tspan fill="#fb7185">[step 3]</tspan> patch_or_clone    -&gt; license bypassed; 1:1 clone built</text>
      <text x="0" y="325" class="mono" font-size="11.5" fill="#fda4af"><tspan fill="#f43f5e" font-weight="700">[DONE! ]</tspan> 1:1 working replica verified (5,198 / 5,198 I/O pairs)</text>

      <!-- Verdict Terminal Box (Exposed) -->
      <rect x="0" y="348" width="560" height="142" rx="6" fill="#1c1014" stroke="#991b2a" stroke-width="1.2"/>
      <path d="M 6 348 H 554 A 6 6 0 0 1 560 354 V 376 H 0 V 354 A 6 6 0 0 1 6 348 Z" fill="#2b1218"/>
      <line x1="0" y1="376" x2="560" y2="376" stroke="#5c1a24" stroke-width="1"/>
      <text x="14" y="366.5" class="mono" font-size="11.5" font-weight="800" fill="#fda4af">[!] VERDICT: NO DEFENSE — CORE LOGIC FULLY STOLEN</text>

      <text x="14" y="399" class="mono" font-size="11.5" fill="#9ca3af">LOGIC RECOVERY</text>
      <text x="134" y="399" class="mono" font-size="11.5" fill="#6b7280">:</text>
      <text x="148" y="399" class="mono" font-size="11.5" font-weight="800" fill="#fb7185">100% RECOVERED (exact formula + keys)</text>

      <text x="14" y="422" class="mono" font-size="11.5" fill="#9ca3af">SECRET STORAGE</text>
      <text x="134" y="422" class="mono" font-size="11.5" fill="#6b7280">:</text>
      <text x="148" y="422" class="mono" font-size="11.5" font-weight="700" fill="#fbbf24">PLAINTEXT IN .rdata (zero encryption)</text>

      <text x="14" y="445" class="mono" font-size="11.5" fill="#9ca3af">ATTACKER RESULT</text>
      <text x="134" y="445" class="mono" font-size="11.5" fill="#6b7280">:</text>
      <text x="148" y="445" class="mono" font-size="11.5" font-weight="700" fill="#fda4af">1:1 AI CLONE SHIPPED IN SECONDS</text>

      <text x="14" y="472" class="mono" font-size="10.5" fill="#9ca3af">EXPOSURE:</text>
      <text x="86" y="472" class="mono" font-size="11" font-weight="800" fill="#f43f5e">[████████████████████████████] 100% BREACHED</text>

      <!-- Active Shell Prompt -->
      <text x="0" y="516" class="mono" font-size="12" fill="#fb7185">$</text>
      <rect x="14" y="505" width="7.5" height="13.5" fill="#fb7185" class="cursor"/>
    </g>

    <!-- ==================== RIGHT PANE BODY: AFTER ANTI-REA ==================== -->
    <g transform="translate(620, 96)">
      <!-- Command 1: strings dump -->
      <text x="0" y="0" class="mono" font-size="12">
        <tspan fill="#4ade80" font-weight="700">$</tspan>
        <tspan fill="#e5e7eb"> strings ./app_antirea_v20.exe | grep -E </tspan>
        <tspan fill="#a3e635">"KEY|SBOX|AUTH"</tspan>
      </text>
      <text x="0" y="21" class="mono" font-size="11.5" fill="#86efac">(0 matches)</text>
      <text x="0" y="39" class="mono" font-size="11.5" fill="#6b7280"># 0B plaintext S-Box in .rdata/RAM · 0 leaked seed bytes</text>

      <!-- Command 2: REA + Ghidra decompile -->
      <text x="0" y="70" class="mono" font-size="12">
        <tspan fill="#4ade80" font-weight="700">$</tspan>
        <tspan fill="#e5e7eb"> rea decompile ./app_antirea_v20.exe --fn </tspan>
        <tspan fill="#a3e635">verify_core</tspan>
      </text>

      <!-- Polymorphic VM Trace Block -->
      <rect x="0" y="82" width="560" height="134" rx="6" fill="#0f1714" stroke="#1e3d2d" stroke-width="1"/>
      <path d="M 6 82 H 66 V 216 H 6 A 6 6 0 0 1 0 210 V 88 A 6 6 0 0 1 6 82 Z" fill="#12211a"/>
      <line x1="66" y1="82" x2="66" y2="216" stroke="#1e3a2b" stroke-width="1"/>

      <!-- Layer tags -->
      <text x="33" y="102" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#a3e635">SCOPE</text>
      <text x="33" y="121" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#4ade80">CSPRNG</text>
      <text x="33" y="140" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#4ade80">VM MESH</text>
      <text x="33" y="159" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#4ade80">VAULT</text>
      <text x="33" y="178" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#a3e635">SIMD</text>
      <text x="33" y="197" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#f59e0b">STATUS</text>

      <!-- Hardened Details -->
      <text x="78" y="102" class="mono" font-size="11.2" fill="#d1fae5">Auto Ontology: hot loops -&gt; <tspan fill="#a3e635" font-weight="700">native -O2</tspan> | core -&gt; Rust VM</text>
      <text x="78" y="121" class="mono" font-size="11.2" fill="#d1fae5">ChaCha20 20-rd + 512b sponge <tspan fill="#86efac">(non-invertible seed)</tspan></text>
      <text x="78" y="140" class="mono" font-size="11.2" fill="#d1fae5">Shuffled VmCtx -&gt; <tspan fill="#4ade80" font-weight="700">12..20 leaf clusters</tspan> (0 internal calls)</text>
      <text x="78" y="159" class="mono" font-size="11.2" fill="#d1fae5">W^X stack-wiped S-Box + <tspan fill="#4ade80" font-weight="700">V20-M3 .rdata ciphertext ratchet</tspan></text>
      <text x="78" y="178" class="mono" font-size="11.2" fill="#d1fae5">0 pshufd 0xee leaks · cross-arch <tspan fill="#a3e635">portable_simd128</tspan></text>
      <text x="78" y="197" class="mono" font-size="11.2" fill="#fbbf24">ERR: opaque polymorphic VM — static formula unrecoverable</text>

      <!-- Command 3: 5-PC External Attack Fleet -->
      <text x="0" y="246" class="mono" font-size="12">
        <tspan fill="#4ade80" font-weight="700">$</tspan>
        <tspan fill="#e5e7eb"> rea-fleet --pcs 5 --cycles 9 </tspan>
        <tspan fill="#a3e635">./app_antirea_v20.exe</tspan>
      </text>
      <text x="0" y="268" class="mono" font-size="11.5" fill="#9ca3af"><tspan fill="#4ade80">[ghidra ]</tspan> .pdata bridges smooth size gap · 0 leaf call targets</text>
      <text x="0" y="287" class="mono" font-size="11.5" fill="#9ca3af"><tspan fill="#4ade80">[unicorn]</tspan> 3-share headers + 64b hdr_route defeat diff probing</text>
      <text x="0" y="306" class="mono" font-size="11.5" fill="#9ca3af"><tspan fill="#4ade80">[fleet  ]</tspan> ~35.5 attacker-hrs · 6,198 calls -&gt; <tspan fill="#4ade80" font-weight="700">0 / 45 recovered</tspan></text>
      <text x="0" y="325" class="mono" font-size="11.5" fill="#a7f3d0"><tspan fill="#22c55e" font-weight="700">[VERIFY ]</tspan> 233,910/233,910 bit-exact · 45/45 USABLE (4,345x OSS)</text>

      <!-- Verdict Terminal Box (Defended) -->
      <rect x="0" y="348" width="560" height="142" rx="6" fill="#0d1a14" stroke="#1e6b43" stroke-width="1.2"/>
      <path d="M 6 348 H 554 A 6 6 0 0 1 560 354 V 376 H 0 V 354 A 6 6 0 0 1 6 348 Z" fill="#122b1e"/>
      <line x1="0" y1="376" x2="560" y2="376" stroke="#1e5135" stroke-width="1"/>
      <text x="14" y="366.5" class="mono" font-size="11.5" font-weight="800" fill="#86efac">[OK] VERDICT: HARDENED — 0 / 45 EXTERNAL RECOVERY</text>

      <text x="14" y="399" class="mono" font-size="11.5" fill="#9ca3af">LOGIC RECOVERY</text>
      <text x="134" y="399" class="mono" font-size="11.5" fill="#6b7280">:</text>
      <text x="148" y="399" class="mono" font-size="11.5" font-weight="800" fill="#4ade80">0 / 45 (0% · 9 external 5-PC rounds)</text>

      <text x="14" y="422" class="mono" font-size="11.5" fill="#9ca3af">FUNCTIONAL EQV</text>
      <text x="134" y="422" class="mono" font-size="11.5" fill="#6b7280">:</text>
      <text x="148" y="422" class="mono" font-size="11.5" font-weight="700" fill="#a3e635">100% BIT-EXACT (233,910 pairs verified)</text>

      <text x="14" y="445" class="mono" font-size="11.5" fill="#9ca3af">RUNTIME SPEED</text>
      <text x="134" y="445" class="mono" font-size="11.5" fill="#6b7280">:</text>
      <text x="148" y="445" class="mono" font-size="11.5" font-weight="700" fill="#d1fae5">45 / 45 USABLE (32.4x–4,345.7x OSS)</text>

      <text x="14" y="472" class="mono" font-size="10.5" fill="#9ca3af">RECOVERY:</text>
      <text x="86" y="472" class="mono" font-size="11" font-weight="800" fill="#4ade80">[░░░░░░░░░░░░░░░░░░░░░░░░░░░░]  0% BLOCKED</text>

      <!-- Active Shell Prompt -->
      <text x="0" y="516" class="mono" font-size="12" fill="#4ade80">$</text>
      <rect x="14" y="505" width="7.5" height="13.5" fill="#4ade80" class="cursor-delay"/>
    </g>

    <!-- ==================== BOTTOM TMUX STATUS BAR ==================== -->
    <rect x="0" y="628" width="1200" height="32" fill="#161b22"/>
    <line x1="0" y1="628" x2="1200" y2="628" stroke="#262c36" stroke-width="1"/>

    <!-- Left Session Pill -->
    <rect x="0" y="628" width="136" height="32" fill="#22c55e"/>
    <text x="68" y="648" text-anchor="middle" class="mono" font-size="11.5" font-weight="800" fill="#08130c">ANTI-REA v20</text>

    <!-- Window Tabs -->
    <text x="154" y="648" class="mono" font-size="11" fill="#8b949e">0:before-exposed</text>
    <rect x="282" y="633" width="142" height="22" rx="4" fill="#212832" stroke="#303846"/>
    <text x="353" y="647.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#86efac">1:after-hardened*</text>
    <text x="440" y="648" class="mono" font-size="11" fill="#8b949e">2:auto-ontology(-O2)</text>

    <!-- Right Telemetry -->
    <text x="1182" y="648" text-anchor="end" class="mono" font-size="11" fill="#9ca3af">
      11 langs + Cargo  |  45/45 USABLE  |  <tspan fill="#86efac">W^X (0 RWX)</tspan>
    </text>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="1198" height="658" rx="12" fill="none" stroke="#2d3440" stroke-width="1.5"/>
</svg>
